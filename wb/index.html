<script>
(function () {
  if (window.__officeEmailRouting) return;
  window.__officeEmailRouting = true;

 
  var EMAILS = {
    "indianapolis office": "contactus@nicolevanledds.com",
    "greenfield office": "greenfield@nicolevanledds.com"
  };
  var FALLBACK = "contactus@nicolevanledds.com";

  function normalize(value) {
    return (value || "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function emailForOffice(office) {
    return EMAILS[normalize(office)] || FALLBACK;
  }

  function officeFromForm(form) {
    var checked = form.querySelector('input[name="dmform-6"]:checked');
    if (!checked) return "";
    if (checked.value) return checked.value;
    var label = checked.closest("label");
    return label ? label.textContent : "";
  }

  function updateSendTo(form) {
    if (!form) return;
    var sendTo = form.querySelector('input[name="dmformsendto"]');
    var subject = form.querySelector('input[name="dmformsubject"]');
    var office = officeFromForm(form);
    var email = emailForOffice(office);
    if (sendTo) {
      sendTo.value = email;
      sendTo.setAttribute("value", email);
    }
    if (subject) {
      var label = office.replace(/\s+/g, " ").trim();
      subject.value = label ? "Contact form — " + label : "Contact form";
    }
  }

  function rewriteBody(body) {
    if (typeof body !== "string" || body.indexOf("dmform-6=") === -1) return body;
    var match = body.match(/dmform-6=([^&]*)/);
    if (!match) return body;
    var office = decodeURIComponent(match[1].replace(/\+/g, " "));
    var email = emailForOffice(office);
    var subject = "Contact form — " + office.replace(/\s+/g, " ").trim();
    if (/dmformsendto=/.test(body)) {
      body = body.replace(/dmformsendto=[^&]*/, "dmformsendto=" + encodeURIComponent(email));
    } else {
      body += "&dmformsendto=" + encodeURIComponent(email);
    }
    if (/dmformsubject=/.test(body)) {
      body = body.replace(/dmformsubject=[^&]*/, "dmformsubject=" + encodeURIComponent(subject));
    }
    return body;
  }

  function isDudaSubmit(url) {
    return String(url || "").indexOf("dmform.submit.jsp") !== -1;
  }

  var origOpen = XMLHttpRequest.prototype.open;
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__officeSubmitUrl = url;
    return origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (body) {
    if (isDudaSubmit(this.__officeSubmitUrl)) body = rewriteBody(body);
    return origSend.call(this, body);
  };

  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url);
      if (init && isDudaSubmit(url) && typeof init.body === "string") {
        var next = {};
        for (var key in init) {
          if (Object.prototype.hasOwnProperty.call(init, key)) next[key] = init[key];
        }
        next.body = rewriteBody(init.body);
        return origFetch.call(this, input, next);
      }
      return origFetch.apply(this, arguments);
    };
  }

  document.addEventListener("change", function (event) {
    if (event.target && event.target.name === "dmform-6") {
      updateSendTo(event.target.closest("form"));
    }
  }, true);

  document.addEventListener("click", function (event) {
    var submit = event.target.closest && event.target.closest('input[type="submit"], button[type="submit"]');
    if (!submit) return;
    var form = submit.closest("form");
    if (form && form.querySelector('input[name="dmform-6"]')) updateSendTo(form);
  }, true);

  document.addEventListener("submit", function (event) {
    var form = event.target && event.target.closest ? event.target.closest("form") : event.target;
    if (form && form.querySelector && form.querySelector('input[name="dmform-6"]')) {
      updateSendTo(form);
    }
  }, true);
})();
</script>
